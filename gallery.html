<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle"></title>

<style>
:root{
  --bg:#0b0b0f; --text:#f2f2f6; --muted:#b7b7c6;
  --line:rgba(255,255,255,.10); --radius:18px; --max:1100px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--bg); color:var(--text);
}
.wrap{max-width:var(--max); margin:0 auto; padding:24px}
.top{
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid var(--line); padding-bottom:14px;
}
h1{margin:0}
p{color:var(--muted)}
.grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:14px; margin-top:20px;
}
.tile{
  grid-column:span 4;
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--line);
}
.tile img{width:100%; height:100%; object-fit:cover}
@media(max-width:900px){.tile{grid-column:span 6}}
@media(max-width:560px){.tile{grid-column:span 12}}
</style>
</head>

<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <a href="index.html" style="color:#b7b7c6">Back to Home</a>
  </div>

  <div id="gallery" class="grid"></div>
</div>

<script src="data/gallery-data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const category = params.get("cat");

const data = GALLERY[category];

document.getElementById("title").textContent = data.title;
document.getElementById("subtitle").textContent = data.subtitle;
document.getElementById("pageTitle").textContent = data.title + " | William Mvutu";

const gallery = document.getElementById("gallery");

data.images.forEach(src=>{
  const div=document.createElement("div");
  div.className="tile";
  div.innerHTML=`<img src="${src}" alt="">`;
  gallery.appendChild(div);
});
</script>
</body>
</html>
